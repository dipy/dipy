ci:
  autoupdate_schedule: monthly

exclude: ".svg|.css|^dipy/data/files"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "indx" ]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
        exclude: "^doc/release_notes|^doc/old_highlights.rst"
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
  - repo: local
    hooks:
      - id: enforce-pep3102-defaults
        name: Enforce keyword-only default arguments (PEP 3102)
        entry: python tools/check_pep3102.py
        language: python
        types: [python]
        # ``dipy/workflows/`` is exempt by design; the other exemptions are a
        # backlog, not a policy: run ``python tools/check_pep3102.py`` on them
        # to see what is left (~310 in tests/, ~75 in workflows/, 13 in doc/ and
        # 7 in the two legacy scripts below, as of 1.13.0). Cython is out of
        # reach entirely -- ``ast`` cannot parse ``.pyx``.
        exclude: |
          (?x)^(
            doc/|
            # vendored from IPython and nipy respectively; not DIPY's API
            tools/(github_stats|gitwash_dumper)\.py|
            # workflows expose ``run`` parameters as a CLI through
            # IntrospectiveArgumentParser, which needs them positional-or-keyword
            dipy/workflows/|
            (.*/)?tests/
          )
      - id: generate_requirements.py
        name: generate_requirements.py
        language: python
        entry: python tools/generate_requirements.py
        files: "pyproject.toml|requirements/.*\\.txt|tools/generate_requirements.py"
        additional_dependencies: ["dependency-groups"]
      - id: dipy-commit-msg
        name: dipy-commit-msg
        entry: tools/hooks/commit-msg.py
        language: python
        stages: [commit-msg]
